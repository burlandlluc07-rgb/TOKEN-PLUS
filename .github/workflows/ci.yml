name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux only: macOS runners bill minutes at 10x and quickly exhaust the
    # free private-repo allowance. Add macos-latest back if you have budget.
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate plugin layout
        run: node scripts/validate-plugin.js
      - name: Shell syntax check
        run: sh -n plugins/token-plus/hooks/run.sh
      - name: Unit + integration tests
        run: npm test
